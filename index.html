<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Letter For You</title>
  <meta name="description" content="A calming interactive letter — click the wax seal to open." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital@0;1&family=Dancing+Script:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- layered, calming backdrop -->
  <div class="bg" aria-hidden="true">
    <div class="bg__mesh"></div>
    <div class="bg__grain"></div>
    <div class="motes" id="motes"></div>
  </div>

  <!-- focal point: the envelope -->
  <main class="scene">
    <button class="envelope" id="envelope" aria-label="Open the letter">
      <span class="envelope__label">A letter awaits you</span>

      <span class="env">
        <span class="env__back"></span>
        <span class="env__peek"></span>
        <span class="env__front"></span>
        <span class="env__flap"></span>
        <span class="seal">
          <span class="seal__mark">&#10084;</span>
        </span>
      </span>

      <span class="envelope__cta">click the seal to open</span>
    </button>
  </main>

  <!-- reading view: guarantees perfect centering at any size -->
  <div class="reader" id="reader" aria-hidden="true">
    <div class="reader__backdrop" id="backdrop"></div>

    <article class="card" role="dialog" aria-modal="true" aria-labelledby="card-title">
      <button class="card__close" id="close" aria-label="Close letter">&#215;</button>

      <div class="card__inner">
        <p class="r r--1 eyebrow">For you</p>
        <h1 class="r r--2 title" id="card-title">Hello World</h1>
        <div class="r r--3 rule"><span></span><i>&#10022;</i><span></span></div>
        <p class="r r--4 body">Thank you for opening this little letter.</p>
        <p class="r r--5 body">May your day be calm, your mind be quiet, and your heart feel light.</p>
        <p class="r r--6 sign">with warmth</p>
      </div>
    </article>
  </div>

  <script src="script.js"></script>
</body>
</html>
